name: Auto-cancel cron

# Vercel Hobby only allows daily cron jobs (vercel.json runs this once a day at 03:00 UTC as a
# fallback). This workflow calls the same idempotent endpoint every 30 minutes so unpaid orders
# auto-cancel close to the configured time and Meta Purchase events flush promptly.
# Setup: Settings → Secrets and variables → Actions → add SITE_URL (e.g. https://mubazzar.ng) and
# CRON_SECRET (same value as the Vercel env var). Without them the job does nothing.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  auto-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/auto-cancel
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET not configured — skipping."
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/auto-cancel"
